<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rufa Golden Cloud</title>
<style>
body{font-family:Arial,Tahoma,sans-serif;margin:0;background:#f7f7f7;color:#222}.header{background:#b49348;color:#0c4b80;text-align:center;padding:22px;font-weight:bold}.header h1{margin:0;font-size:28px}.header div{font-size:30px}.wrap{max-width:1100px;margin:25px auto;background:white;padding:22px;border-radius:12px;box-shadow:0 2px 12px #0001}.btn{display:inline-block;border:0;border-radius:4px;padding:12px 22px;margin:6px;background:#1f4e78;color:white;text-decoration:none;font-weight:bold;cursor:pointer}.green{background:#116b2d}.gold{background:#b48716}.brown{background:#765d35}.red{background:#a32424}.gray{background:#555}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #999;border-radius:3px;font-size:16px;text-align:right}textarea{min-height:95px}table{width:100%;border-collapse:collapse;margin-top:15px;background:white}th,td{border:1px solid #bbb;padding:10px;text-align:right;vertical-align:top}th{background:#eee}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.nav{text-align:center;margin-top:15px}.flash{background:#e8f5e9;border:1px solid #81c784;padding:10px;margin-bottom:10px}.small{font-size:13px;color:#555}.card{border:1px solid #ccc;border-radius:8px;padding:12px;margin:10px 0}.img{max-width:220px;border-radius:8px}.autosave{background:#fff8e1;border:1px solid #e0b94f;padding:8px;border-radius:6px;margin:8px 0;font-size:14px}
@media(max-width:700px){.row{grid-template-columns:1fr}.btn{width:100%;box-sizing:border-box;text-align:center}table{font-size:13px}}
</style>
<script>
function toggleAll(source){document.querySelectorAll('input[name="selected"]').forEach(cb=>cb.checked=source.checked)}
function saveDraft(formId){const f=document.getElementById(formId); if(!f)return; [...f.elements].forEach(el=>{if(el.name&&el.type!=='file') localStorage.setItem(formId+'_'+el.name,el.value);}); const n=document.getElementById(formId+'_note'); if(n)n.textContent='تم حفظ المسودة تلقائياً على هذا الجهاز';}
function loadDraft(formId){const f=document.getElementById(formId); if(!f)return; [...f.elements].forEach(el=>{if(el.name&&el.type!=='file'){const v=localStorage.getItem(formId+'_'+el.name); if(v && !el.value) el.value=v; el.addEventListener('input',()=>saveDraft(formId));}});}
function clearDraft(formId){const f=document.getElementById(formId); if(!f)return; [...f.elements].forEach(el=>{if(el.name) localStorage.removeItem(formId+'_'+el.name);});}
</script>
</head><body><div class="header"><div>روفا جولدن</div><h1>Rufa Golden Cloud</h1></div><div class="wrap">{% with msgs=get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
