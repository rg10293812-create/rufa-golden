{% extends 'base.html' %}{% block content %}
<a class="btn gray" href="{{url_for('index')}}">الرئيسية</a>
<h2>{{title}}</h2>
<div><a class="btn" href="{{url_for('contacts',category='marketers')}}">أرقام المسوقين</a><a class="btn" href="{{url_for('contacts',category='customers')}}">أرقام الزباين</a><a class="btn" href="{{url_for('contacts',category='developers')}}">أرقام المطورين</a></div>
<form id="contactForm" method="post" onsubmit="clearDraft('contactForm')">
<div class="autosave" id="contactForm_note">الحقول تحفظ كمسودة تلقائياً، وعند الضغط على حفظ يتم حفظ الرقم على السحابة.</div>
<div class="row"><input name="name" placeholder="الاسم"><input name="phone" placeholder="رقم الجوال"><input name="notes" placeholder="ملاحظات"></div><button class="btn green">حفظ الرقم سحابياً</button></form><script>loadDraft('contactForm')</script>
<form method="post" action="{{url_for('send_whatsapp')}}"><input type="hidden" name="category" value="{{category}}"><textarea name="message" placeholder="اكتب الرسالة هنا"></textarea><label><input type="checkbox" onclick="toggleAll(this)" style="width:auto"> تحديد الكل</label><button class="btn gold">إرسال رسالة واتساب للمحدد</button>
<table><tr><th>تحديد</th><th>الاسم</th><th>الجوال</th><th>ملاحظات</th><th>حذف</th></tr>{% for r in rows %}<tr><td><input type="checkbox" name="selected" value="{{r.id}}" style="width:auto"></td><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.notes}}</td><td><form method="post" action="{{url_for('delete_contact',cid=r.id,category=category)}}"><button class="btn red" onclick="return confirm('حذف؟')">حذف</button></form></td></tr>{% endfor %}</table></form>
{% endblock %}
