{% extends 'base.html' %}
{% block content %}
<h3>{{ 'تعديل عقار' if prop else 'إضافة عقار' }}</h3>
<div class="card p-3"><form method="post" enctype="multipart/form-data">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">اسم المشروع</label><input class="form-control" name="project_name" value="{{ prop.project_name if prop else '' }}" required></div>
    <div class="col-md-3"><label class="form-label">نوع العقار</label><input class="form-control" name="property_type" value="{{ prop.property_type if prop else '' }}" placeholder="فيلا / دور / شقة" required></div>
    <div class="col-md-3"><label class="form-label">الحي</label><input class="form-control" name="district" value="{{ prop.district if prop else '' }}" required></div>
    <div class="col-md-4"><label class="form-label">السعر</label><input class="form-control" name="price" value="{{ prop.price if prop else '' }}"></div>
    <div class="col-md-4"><label class="form-label">الحالة</label><select class="form-select" name="status"><option value="available" {% if prop and prop.status=='available' %}selected{% endif %}>متاح</option><option value="reserved" {% if prop and prop.status=='reserved' %}selected{% endif %}>محجوز</option><option value="sold" {% if prop and prop.status=='sold' %}selected{% endif %}>مباع</option></select></div>
    <div class="col-md-4"><label class="form-label">صور العقار</label><input class="form-control" type="file" name="images" multiple accept="image/*"></div>
    <div class="col-12"><label class="form-label">المواصفات</label><textarea class="form-control" name="specs" rows="6">{{ prop.specs if prop else '' }}</textarea></div>
  </div>
  <button class="btn btn-gold mt-3">حفظ تلقائي</button>
  <a class="btn btn-outline-dark mt-3" href="{{ url_for('properties') }}">رجوع</a>
</form></div>
{% endblock %}
